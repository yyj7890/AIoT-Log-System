persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883 0.0.0.0
# Public reference template. Docker actually mounts the ignored
# docker/local/mosquitto-lan.conf generated by docker-update.cmd.
allow_anonymous false
password_file /mosquitto/config/mosquitto-passwords
acl_file /mosquitto/config/mosquitto-acl.conf
