name: aiot-log-system

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Run docker-ghcr-update.cmd or create a private .env first}"
      MYSQL_DATABASE: aiot_log_system
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/local/mosquitto-lan.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/local/mosquitto-passwords:/mosquitto/config/mosquitto-passwords:ro
      - ./docker/local/mosquitto-acl.conf:/mosquitto/config/mosquitto-acl.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  backend:
    image: "ghcr.io/yyj7890/aiot-log-backend:${AIOT_IMAGE_TAG:-latest}"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aiot_log_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Run docker-ghcr-update.cmd or create a private .env first}"
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: aiot-log-backend-docker
      MQTT_DISCOVERY_ENABLED: "${MQTT_DISCOVERY_ENABLED:-false}"
      MQTT_DISCOVERY_PORT: "${MQTT_DISCOVERY_PORT:-19830}"
      MQTT_DISCOVERY_BROKER_HOST: "${MQTT_DISCOVERY_BROKER_HOST:-}"
      MQTT_DISCOVERY_BROKER_PORT: "${MQTT_PORT:-1883}"
      MQTT_DISCOVERY_TOKEN: "${MQTT_DISCOVERY_TOKEN:-}"
      SPRING_CONFIG_IMPORT: optional:file:/app/config/mqtt-credentials.properties
      IOT_CONFIG_DIR: /app/config
      MOSQUITTO_PASSWD_EXECUTABLE: /usr/bin/mosquitto_passwd
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${MQTT_DISCOVERY_PORT:-19830}:19830/udp"
    volumes:
      - ./docker/local:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: "ghcr.io/yyj7890/aiot-log-frontend:${AIOT_IMAGE_TAG:-latest}"
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  mosquitto-data:
