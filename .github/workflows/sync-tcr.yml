name: Sync fixed images to Tencent TCR

on:
  push:
    branches:
      - Remote-Hivemq
    paths:
      - '.github/workflows/sync-tcr.yml'
      - 'docker-compose.remote.ghcr.yml'
      - 'docker-compose.remote.tcr.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Fixed remote image tag to synchronize
        required: true
        default: v1.2.0-remote-mqtt
        type: string

permissions:
  contents: read
  packages: read

env:
  SOURCE_REGISTRY: ghcr.io/yyj7890
  TARGET_REGISTRY: ccr.ccs.tencentyun.com/aiot-log-system

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate fixed tag
        id: tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          $requestedTag = $env:REQUESTED_TAG
          $ghcrText = Get-Content -Raw -Encoding UTF8 docker-compose.remote.ghcr.yml
          $tcrText = Get-Content -Raw -Encoding UTF8 docker-compose.remote.tcr.yml
          $ghcrTags = @([regex]::Matches(
            $ghcrText,
            'ghcr\.io/yyj7890/aiot-log-(?:backend|frontend):([A-Za-z0-9._-]+)'
          ) | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
          $tcrTags = @([regex]::Matches(
            $tcrText,
            'ccr\.ccs\.tencentyun\.com/aiot-log-system/aiot-log-(?:backend|frontend):([A-Za-z0-9._-]+)'
          ) | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
          if ($ghcrTags.Count -ne 1 -or $tcrTags.Count -ne 1 -or $ghcrTags[0] -ne $tcrTags[0]) {
            throw 'GHCR and Tencent TCR Compose files must use one identical fixed tag.'
          }
          $imageTag = if ($requestedTag) { $requestedTag } else { $ghcrTags[0] }
          if ($imageTag -notmatch '^v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$' -or $imageTag -eq 'latest') {
            throw "Invalid fixed image tag: $imageTag"
          }
          "image_tag=$imageTag" >> $env:GITHUB_OUTPUT

  sync:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - aiot-log-backend
          - aiot-log-frontend
    steps:
      - name: Require Tencent TCR credentials
        shell: bash
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          if [[ -z "$TCR_USERNAME" || -z "$TCR_PASSWORD" ]]; then
            echo "::error::Configure repository secrets TCR_USERNAME and TCR_PASSWORD before synchronizing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Tencent TCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Relay fixed image through the runner without rebuilding
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          source_image="${SOURCE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          target_image="${TARGET_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          for attempt in 1 2 3; do
            echo "Relay attempt $attempt/3 for $target_image"
            if docker pull "$source_image" && docker tag "$source_image" "$target_image" && docker push "$target_image"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::Unable to relay $source_image to Tencent TCR after three attempts."
          exit 1

      - name: Verify source and mirror digest match
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          source_image="${SOURCE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          target_image="${TARGET_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          source_digest="$(docker buildx imagetools inspect "$source_image" | awk '/^Digest:/ {print $2; exit}')"
          target_digest="$(docker buildx imagetools inspect "$target_image" | awk '/^Digest:/ {print $2; exit}')"
          if [[ -z "$source_digest" || "$source_digest" != "$target_digest" ]]; then
            echo "::error::Digest mismatch: GHCR=$source_digest TCR=$target_digest"
            exit 1
          fi
          echo "Verified identical digest for $target_image: $target_digest"
