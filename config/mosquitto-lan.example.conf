# Public Mosquitto LAN configuration template.
# Copy this file to mosquitto-lan.conf locally, then replace the two paths.
# Use a firewall rule limited to a trusted private LAN; do not expose port 1883 publicly.
listener 1883 0.0.0.0
allow_anonymous false
password_file <absolute-path-to-mosquitto-password-file>
acl_file <absolute-path-to-mosquitto-acl-file>
log_dest stdout
