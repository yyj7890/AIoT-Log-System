name: aiot-log-system-remote

# For Synology Container Manager after importing
# dist/aiot-remote-mqtt-v1.4.2-images.tar. Keep the existing project name,
# docker/local/hivemq-remote.env and mysql-data volume unchanged.
services:
  mysql:
    image: mysql:8.4
    env_file:
      - ./docker/local/hivemq-remote.env
    environment:
      MYSQL_DATABASE: aiot_log_system
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: local/aiot-log-backend:v1.4.2-remote-mqtt
    env_file:
      - ./docker/local/hivemq-remote.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aiot_log_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      MQTT_ENABLED: "true"
      MQTT_MODE: remote
      MQTT_DISCOVERY_ENABLED: "false"
      MQTT_CLIENT_ID: aiot-log-backend-remote
      MQTT_REMOTE_CREDENTIAL_FILE: /app/private-config/hivemq-remote-credentials.properties
      IOT_CONFIG_DIR: /app/private-config
      TZ: Asia/Shanghai
    volumes:
      - ./docker/local:/app/private-config
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: local/aiot-log-frontend:v1.4.2-remote-mqtt
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
