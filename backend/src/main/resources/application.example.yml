# Public configuration template. Copy to application.yml locally and provide
# real values through environment variables; never commit local credentials.
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aiot-log-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:<jdbc-url>}
    username: ${DB_USERNAME:<database-username>}
    password: ${DB_PASSWORD:<database-password>}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema before Flyway
    validate-migration-naming: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-none}]"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

mqtt:
  enabled: ${MQTT_ENABLED:true}
  mode: ${MQTT_MODE:lan}
  broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
  client-id: ${MQTT_CLIENT_ID:aiot-log-backend}
  username: ${MQTT_USERNAME:<mqtt-username>}
  password: ${MQTT_PASSWORD:<mqtt-password>}
  remote-credential-file: ${MQTT_REMOTE_CREDENTIAL_FILE:}
  topic: ${MQTT_TOPIC:aiot/device/+/report}
  log-topic: ${MQTT_LOG_TOPIC:aiot/device/+/log}
  announcement-ack-topic: ${MQTT_ANNOUNCEMENT_ACK_TOPIC:aiot/device/+/announcement/ack}
  runtime-log-merge-window-seconds: ${MQTT_RUNTIME_LOG_MERGE_WINDOW_SECONDS:30}
  qos: ${MQTT_QOS:1}
announcement:
  test-enabled: ${ANNOUNCEMENT_TEST_ENABLED:false}
  fixed-test-resource: ${ANNOUNCEMENT_FIXED_TEST_RESOURCE:classpath:announcements/fixed-test/manifest.json}
reminder:
  scheduler-enabled: ${REMINDER_SCHEDULER_ENABLED:false}
  poll-interval-ms: ${REMINDER_POLL_INTERVAL_MS:30000}
  discovery:
    enabled: ${MQTT_DISCOVERY_ENABLED:true}
    port: ${MQTT_DISCOVERY_PORT:19830}
    broker-host: ${MQTT_DISCOVERY_BROKER_HOST:}
    broker-port: ${MQTT_DISCOVERY_BROKER_PORT:1883}
    tls: ${MQTT_DISCOVERY_TLS:false}
    token: ${MQTT_DISCOVERY_TOKEN:}
